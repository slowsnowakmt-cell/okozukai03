<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>しっかり！おこづかいライフ</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

body {
  font-family: "Rounded Mplus 1c", "Yu Gothic", sans-serif;
  min-height: 100vh;
  width: 100vw;
  background: url('bg/default.jpg') no-repeat center center fixed;
  background-size: cover;
  -webkit-background-size: cover;
  color: #333;
  text-align: center;
  transition: background-image 1s ease-in-out;
}

#title {
  height: 100vh;
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-shadow: 0 0 8px rgba(0,0,0,0.2);
}
#title h1 {
  font-size: 2.4em;
  animation: floatTitle 4s ease-in-out infinite;
}
@keyframes floatTitle {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
#startBtn {
  background: white;
  border: none;
  border-radius: 30px;
  padding: 15px 40px;
  margin-top: 40px;
  font-size: 1.2em;
  color: #3498db;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  cursor: pointer;
  animation: floatBtn 3.5s ease-in-out infinite;
}
@keyframes floatBtn {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(8px); }
}

#game {
  display: none;
  max-width: 480px;
  margin: 0 auto;
  margin-top: 20px;
  background: rgba(255,255,255,0.85);
  border-radius: 15px;
  padding: 20px;
}

button {
  background-color: #ffb84c;
  border: none;
  border-radius: 12px;
  color: white;
  padding: 10px 20px;
  margin: 10px;
  cursor: pointer;
  font-size: 16px;
}
button:hover { background-color: #ffa733; }

.stats {
  background: rgba(255,255,255,0.6);
  border-radius: 12px;
  padding: 10px;
  margin-top: 15px;
}
</style>
</head>
<body>

<div id="title">
  <h1>しっかり！おこづかいライフ</h1>
  <button id="startBtn">はじめる！</button>
</div>

<div id="game">
  <p id="text"></p>
  <div id="choices"></div>
  <div class="stats" id="stats"></div>
</div>

<audio id="bgm-main" src="bgm/main.mp3" loop></audio>
<audio id="bgm-event" src="bgm/event.mp3" loop></audio>
<audio id="bgm-luxury" src="bgm/luxury.mp3" loop></audio>
<audio id="se-click" src="se/click.mp3"></audio>
<audio id="se-buy" src="se/buy.mp3"></audio>
<audio id="se-success" src="se/success.mp3"></audio>
<audio id="se-end" src="se/end.mp3"></audio>

<script>
let month = 4;
let money = 0;
let happy = 0;
let switchBought = false;
let specialGift = false;
let magicEnding = false;

const months = ["4月","5月","6月","7月","8月","9月","10月","11月","12月","1月","2月","3月"];

document.getElementById("startBtn").onclick = () => {
  playSe("click");
  document.getElementById("title").style.display = "none";
  document.getElementById("game").style.display = "block";
  playBgm("main");
  startGame();
};

function playBgm(type){
  ["main","event","luxury"].forEach(id=>{
    const a=document.getElementById("bgm-"+id);
    a.pause(); a.currentTime=0;
  });
  const bg=document.getElementById("bgm-"+type);
  if(bg){ bg.volume=0.5; bg.play().catch(()=>{}); }
}
function playSe(id){
  const s=document.getElementById("se-"+id);
  if(s){ s.currentTime=0; s.play().catch(()=>{}); }
}

function setSeasonBackground(month, eventType="normal"){
  let file;
  if(month===4 || month===5){
    file = `bg/${month}${eventType==="event"?"_event":""}.jpg`;
  } else {
    file = `bg/default.jpg`;
  }
  document.body.style.backgroundImage = `url('${file}')`;
}

function show(text, choices=[]){
  const t=document.getElementById("text");
  const c=document.getElementById("choices");
  t.innerHTML=text.replace(/\n/g,"<br>");
  c.innerHTML="";
  choices.forEach(opt=>{
    const b=document.createElement("button");
    b.textContent=opt.text;
    b.onclick=()=>{ playSe("click"); opt.action(); };
    c.appendChild(b);
  });
  document.getElementById("stats").innerHTML=`📅${months[month-4]}<br>💰${money}円<br>😊幸福度:${happy}`;
}

/* 🌸 ゲーム開始 */
function startGame(){
  show("🌸新しい1年がはじまります！\n計画的におこづかいを使ってしあわせな1年をめざそう！",[{
    text:"スタート！", action:nextMonth
  }]);
}

/* 月進行 */
function nextMonth(){
  if(month>12){endGame();return;}
  setSeasonBackground(month);
  show(`🌙 ${months[month-4]}になった！`,[{text:"月初イベントへ",action:randomEvent}]);
}

/* ランダムイベント（魔女含む） */
function randomEvent(){
  const r=Math.random();
  let msg="";

  if(r<0.2){ msg="🌱何も起こらなかった。"; }
  else if(r<0.4){ msg="👨‍🦱おじさんが臨時おこづかいをくれた！(+10000円,幸福度+10)"; money+=10000; happy+=10; }
  else if(r<0.7){ msg="👮お財布を届けて500円もらった！(+500円,幸福度+5)"; money+=500; happy+=5; }
  else if(r<0.9){ msg="👩ママのお手伝いをがんばって1000円！(+1000円,幸福度+7)"; money+=1000; happy+=7; }
  else { return witchEvent(); }

  show(msg,[{text:"お小遣いへ",action:monthlyAllowance}]);
}

/* 🧙‍♀️ 魔女イベント */
function witchEvent(){
  playBgm("event");
  show("🧙‍♀️森の中で魔法使いのお姉さんに出会った！\n「カレーの作り方を知りたいの。次のうち正しいのはどれ？」",[
    {text:"1. 玉ねぎを先に炒める",action:()=>magicResult(true)},
    {text:"2. ルーを最初に入れる",action:()=>magicResult(false)},
    {text:"3. 水を入れないで煮る",action:()=>magicResult(false)}
  ]);
}

function magicResult(correct){
  if(correct){
    magicEnding = true;
    happy += 50;
    show("✨正解！あなたは魔女の弟子として魔法使いになった！幸福度+50",[{
      text:"次の月へ",action:()=>{month++;playBgm("main");nextMonth();}
    }]);
  }else{
    show("💫ちょっと違ったみたい…。でも楽しかった！",[{
      text:"次の月へ",action:()=>{month++;playBgm("main");nextMonth();}
    }]);
  }
}

/* お小遣い支給 */
function monthlyAllowance(){
  money+=3000;
  show("💰今月のおこづかい3000円をもらった！",[{text:"どこへ行く？",action:chooseShop}]);
}

/* 買い物 */
function chooseShop(){
  show("🏙️どこに行く？",[
    {text:"おもちゃ屋へ",action:toyShop},
    {text:"デパートへ",action:departmentStore},
    {text:"今月はがまんする",action:monthEvent}
  ]);
}

/* 店 */
function toyShop(){
  playBgm("event");
  show("🧸おもちゃ屋に来た！",[
    {text:"ニンテンドースイッチ(18000円)",action:()=>buyItem("switch",18000,30)},
    {text:"ゲームソフト(2000円)",action:()=>buyItem("game",2000,8)},
    {text:"UFOキャッチャー(500円)",action:()=>buyItem("ufo",500,3)},
    {text:"やっぱりおうちに帰る",action:chooseShop}
  ]);
}
function departmentStore(){
  playBgm("event");
  show("🛍️デパートに来た！",[
    {text:"かわいい服(5000円)",action:()=>buyItem("clothes",5000,10)},
    {text:"プリキュアのおもちゃ(2000円)",action:()=>buyItem("toy",2000,5)},
    {text:"プレゼント(3000円)",action:()=>buyItem("gift",3000,8)},
    {text:"お菓子の詰め合わせ(1000円)",action:()=>buyItem("sweets",1000,4)},
    {text:"やっぱりおうちに帰る",action:chooseShop}
  ]);
}

/* 購入処理 */
function buyItem(name, price, happyPlus){
  if(money>=price){
    money-=price; happy+=happyPlus; playSe("buy");
    if(name==="switch")switchBought=true;
    show(`🛒${price}円で${name==="switch"?"ニンテンドースイッチ":"アイテム"}を買った！幸福度+${happyPlus}`,[{text:"戻る",action:chooseShop}]);
  } else {
    playSe("end");
    show("💦お金が足りない…",[ {text:"戻る",action:chooseShop} ]);
  }
}

/* 月イベント */
function monthEvent(){
  let msg="",eventType="normal";
  switch(month){
    case 4: money+=2000; msg="🌸入学祝いで2000円もらった！"; eventType="event"; break;
    case 5: eventType="event";
      show("💐母の日。カーネーションを買う？",[
        {text:"買う（2000円）",action:()=>{if(money>=2000){money-=2000;happy+=10;playSe("buy");show("お母さんが喜んでくれた！幸福度+10",[{
          text:"次の月へ",action:()=>{month++;playBgm("main");nextMonth();}}]);} else {show("お金が足りない…",[{
          text:"次の月へ",action:()=>{month++;playBgm("main");nextMonth();}}]);}}},
        {text:"買わない",action:()=>{show("ちょっと申し訳ない気持ちに…",[{
          text:"次の月へ",action:()=>{month++;playBgm("main");nextMonth();}}]);}}
      ]); return;
    case 8: money+=20000; msg="🏠祖父の家で臨時収入！20000円もらった！（デモ用）"; eventType="event"; break;
    case 12:
      eventType="event";
      show("🎄クリスマス！ずっと欲しかったもの（20000円）を買う？",[
        {text:"買う（20000円）",action:()=>{if(money>=20000){money-=20000;happy+=50;specialGift=true;playBgm("luxury");show("🎁夢がかなった！幸福度+50",[{
          text:"エンディングへ",action:endGame}]);}else{show("💦お金が足りない…",[{
          text:"次の月へ",action:()=>{month++;playBgm("main");nextMonth();}}]);}}},
        {text:"やめる",action:()=>{show("🎅今年はがまんして来年に期待！",[{
          text:"次の月へ",action:()=>{month++;playBgm("main");nextMonth();}}]);}}
      ]); return;
    default: msg="特に大きなイベントはなかった。";
  }
  setSeasonBackground(month,eventType);
  show(msg,[{text:"次の月へ",action:()=>{month++;playBgm("main");nextMonth();}}]);
}

/* エンディング */
function endGame(){
  playBgm("luxury");
  playSe("end");
  let end="";
  if(magicEnding) end="🧙‍♀️魔法使いエンド！あなたは特別な力を手に入れた！";
  else if(specialGift) end="🎁夢がかなった特別な一年！";
  else if(switchBought) end="🎮スイッチライフエンド！";
  else if(happy>=150 && money>=30000) end="🌟最高の一年！";
  else if(happy>=150) end="😊しあわせいっぱいエンド！";
  else if(money>=30000) end="💰しっかり貯めたエンド！";
  else end="🌙ふつうの一年だった。";

  show(`🏁エンディング<br>${end}<br><br>💰${money}円<br>😊幸福度:${happy}`,[{text:"もう一度あそぶ",action:()=>location.reload()}]);
}
</script>
</body>
</html>
